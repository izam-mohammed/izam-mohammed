version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    assignees: [izam-mohammed]
    labels: ["dependencies", "github_actions", "ci"]
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 100
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    assignees: [izam-mohammed]
    labels: ["dependencies", "pre_commit"]
    groups:
      pre-commit:
        patterns: ["*"]
        update-types: [minor, patch]
